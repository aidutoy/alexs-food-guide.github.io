
<!DOCTYPE html>
<html lang="en" class="bg-brand-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Alex's Food Guide – Authentic Reviews & Genuine Food Photography</title>
    <meta name="description" content="A curated personal guide of honest culinary discoveries, hidden gems, and 100% authentic unedited food photography across Germany, Europe, and beyond." />
    <meta name="theme-color" content="#AD343E" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alex's Food Guide" />
    <meta property="og:title" content="Alex's Food Guide – Authentic Reviews & Genuine Food Photography" />
    <meta property="og:description" content="Personal culinary discoveries, honest ratings, and 100% authentic unedited food photography across Germany, Europe, and beyond. Just as I saw it." />
    <meta property="og:image" content="https://raw.githubusercontent.com/aidutoy/alexs-food-guide-images/main/images/darmstadt/darmstadt.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alex's Food Guide – Authentic Reviews & Genuine Food Photography" />
    <meta name="twitter:description" content="Personal culinary discoveries, honest ratings, and 100% authentic unedited food photography across Germany, Europe, and beyond. Just as I saw it." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/aidutoy/alexs-food-guide-images/main/images/darmstadt/darmstadt.jpg" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Alex's Food Guide",
          "description": "A curated personal food guide showcasing authentic culinary discoveries with honest ratings and unedited photography.",
          "author": {
            "@type": "Person",
            "name": "Alex"
          }
        },
        {
          "@type": "TouristTrip",
          "name": "Alex's Culinary Discoveries",
          "description": "Honest restaurant recommendations across Darmstadt, Bonn, Köln, Bruges, Lisbon, Cairo, Luxor, and Mallorca."
        }
      ]
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Leaflet CSS for real interactive maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      /* Ensure Leaflet controls match site theme */
      .leaflet-container {
        background: #121212 !important;
        font-family: inherit;
      }
      .leaflet-popup-content-wrapper {
        background: rgba(24, 24, 27, 0.95) !important;
        color: #fff !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        border-radius: 1rem !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5) !important;
        backdrop-filter: blur(12px) !important;
        padding: 4px !important;
      }
      .leaflet-popup-tip {
        background: rgba(24, 24, 27, 0.95) !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
      }
      .leaflet-popup-close-button {
        color: rgba(255, 255, 255, 0.7) !important;
        padding: 6px !important;
      }
      .leaflet-bar {
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        border-radius: 0.75rem !important;
        overflow: hidden !important;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5) !important;
      }
      .leaflet-bar a {
        background-color: rgba(24, 24, 27, 0.9) !important;
        color: #fff !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
      }
      .leaflet-bar a:hover {
        background-color: #AD343E !important;
        color: #fff !important;
      }
      .leaflet-attribution-flag {
        display: none !important;
      }
      .leaflet-control-attribution {
        background: rgba(0, 0, 0, 0.6) !important;
        color: rgba(255, 255, 255, 0.5) !important;
        font-size: 10px !important;
        border-radius: 4px;
        margin: 4px;
      }
      .leaflet-control-attribution a {
        color: rgba(255, 255, 255, 0.7) !important;
      }
    </style>
    <script>
      // Service worker registration for offline PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('Service Worker registration skipped:', err);
          });
        });
      }
    </script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'playfair': ['"Playfair Display"', 'serif'],
              'roboto': ['"Roboto"', 'sans-serif'],
            },
            colors: {
              'brand-primary': '#AD343E',
              'brand-secondary': '#474747',
              'brand-light': '#F8F8F8',
              'brand-dark': '#1E1E1E',
              'brand-accent': '#14B8A6',
            },
            backdropBlur: {
              xs: '2px',
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'slide-up': {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1' },
              },
              'slow-zoom': {
                '0%': { transform: 'scale(1)' },
                '100%': { transform: 'scale(1.1)' },
              },
              'scroll': {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              'scroll-reverse': {
                '0%': { transform: 'translateX(-50%)' },
                '100%': { transform: 'translateX(0)' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.3s ease-out',
              'slide-up': 'slide-up 0.6s ease-out forwards',
              'slow-zoom': 'slow-zoom 20s linear infinite alternate',
              'scroll': 'scroll 40s linear infinite',
              'scroll-reverse': 'scroll-reverse 40s linear infinite',
            },
          },
        },
      }
    </script>

}
</script>
